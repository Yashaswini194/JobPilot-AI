{% extends "tracker/base.html" %}
{% block content %}
<div class="card">
  <h1>Delete application?</h1>
  <p>{{ object }}</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete</button>
    <a href="{% url 'application_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}

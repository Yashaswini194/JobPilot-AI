{% extends "tracker/base.html" %}
{% block content %}
<div class="card">
  <h1>{% if object %}Edit{% else %}Add{% endif %} application</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a href="{% url 'application_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
